services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    container_name: mssql
    restart: unless-stopped
    ports:
      - "1433:1433"
    environment:
      ACCEPT_EULA: "Y"
      # default password : sa
      MSSQL_SA_PASSWORD: "Super@Secure1"
    volumes:
      - ./mssql:/var/opt/mssql
