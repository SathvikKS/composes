name: composes

services:
  postgres:
    image: postgis/postgis:18-3.6
    container_name: local_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      TZ: Asia/Kolkata
    ports:
      - "5432:5432"
    volumes:
      # 18+ uses version-specific subdirs under /var/lib/postgresql (see docker-library/postgres#1259)
      - ./postgres/data:/var/lib/postgresql

